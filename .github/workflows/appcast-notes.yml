# Rebuild the release notes in the public appcast.xml from CHANGELOG.md, without
# building or releasing anything. Run it by hand (Actions → appcast-notes → Run
# workflow) after fixing a released version's CHANGELOG section, or after a change to
# how notes render (.github/scripts/release_notes.py). release.yml does the same on
# every release. Only the descriptions change: versions, URLs and signatures stay.
name: appcast-notes

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_REPO: 90n9/quest-bits-releases

# Same group as release.yml on main, so the two never push the appcast at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild appcast.xml notes in the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" public-repo
          python3 .github/scripts/release_notes.py appcast CHANGELOG.md public-repo/appcast.xml
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml notes are already up to date."
          else
            git commit -m "appcast: rebuild release notes"
            git push origin HEAD:main
          fi
